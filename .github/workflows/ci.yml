name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules and install dependencies first
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Determine the git base ref for Nx comparisons. For PRs use the PR base; otherwise default to main.
      - name: Set NX_BASE for PRs
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "NX_BASE=remotes/origin/${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV

      - name: Set NX_BASE for non-PR runs
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "NX_BASE=remotes/origin/main" >> $GITHUB_ENV

      # Start Nx Cloud agents only when NX_CLOUD_AUTH secret is configured
      - if: ${{ secrets.NX_CLOUD_AUTH }}
        run: npx --yes nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Run formatting check. Use nx record when Nx Cloud auth exists so results are recorded.
      - if: ${{ secrets.NX_CLOUD_AUTH }}
        run: npx --yes nx record -- npx --yes nx format:check --base="${{ env.NX_BASE }}"
      - if: ${{ !secrets.NX_CLOUD_AUTH }}
        run: npx --yes nx format:check --base="${{ env.NX_BASE }}"

      - run: npx --yes nx run-many -t lint test build typecheck e2e-ci
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx --yes nx fix-ci
        if: always()
