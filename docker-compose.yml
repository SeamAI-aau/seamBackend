services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: seamai_api
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16.2
    container_name: seamai_postgres
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: seamai_redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

volumes:
  postgres_data:
